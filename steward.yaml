schema: steward/v1

repo:
  id: webp_animation_flutter
  archetype: library

harness:
  name: steward
  mode: cli
  entrypoints:
    cli: steward

adoption:
  status: adopting
  owner: webp_animation_flutter
  gate:
    pillar: quality

stewardship:
  governance:
    charter: AGENTS.md
    adr_dir: docs/decisions
  knowledge:
    docs_map: AGENTS.md
    source_policy: required_for_external_claims
  repo_quality:
    contract_spec: steward.yaml
    maturity_model: general_stewardship
  skill_lifecycle:
    installable_skills: false
    registry: skills.json
  quality:
    validate: flutter test
    evidence: .steward/evidence
  harness:
    enabled: false
    action_contract: deferred
  release:
    changelog: CHANGELOG.md
    artifact_provenance: required
  review_handoff:
    moe_required_for_architecture: true
  strategic_alignment:
    vision_source: README.md
    success_evidence: required
  security:
    action_effects: required
    redaction: steward/redaction/v1
  org:
    owners: AGENTS.md

actions: {}

probes: {}

diagnostics:
  cases: {}

unknown_cases:
  path: .steward/unknown-cases/
  retention: local

provenance:
  dependencies: []
  artifacts: []
  benchmarks: []
